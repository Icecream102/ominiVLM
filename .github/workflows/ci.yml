name: CI

on:
  push:
  pull_request:

jobs:
  lightweight-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_caption_metrics.py tests/test_grpo_rewards.py tests/test_experiment_config.py tests/test_summarize_experiment.py
      - run: python -m json.tool configs/full_pipeline_5090.json >/dev/null
      - run: python -m compileall -q dataset evaluation model scripts trainer
